[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safari"
version = "0.1.0"
description = "Segment-based Animal Forecasting and Risk Intelligence"
authors = [
    {name = "S.A.F.A.R.I. Team"}
]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "shap",
    "matplotlib",
    "plotly",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
