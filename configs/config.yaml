# S.A.F.A.R.I. Configuration

data:
  raw_path: "data/raw/collisions.csv"
  processed_path: "data/processed/processed_data.csv"
  target_column: "collision_occurred"

modeling:
  random_seed: 42
  test_size: 0.2
  models:
    logistic_regression:
      max_iter: 1000
    random_forest:
      n_estimators: 100
      max_depth: 10
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5

outputs:
  model_dir: "outputs/models/"
  metrics_dir: "outputs/metrics/"
  predictions_dir: "outputs/predictions/"
  shap_dir: "outputs/shap/"
  figures_dir: "outputs/figures/"
